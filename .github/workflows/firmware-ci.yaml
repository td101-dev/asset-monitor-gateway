name: Firmware CI Pipeline

# Monorepo note: this workflow lives at .github/workflows/firmware-ci.yml
# (GitHub only discovers workflows there), but only triggers on changes
# under firmware/ so hardware/manufacturing-only commits don't burn CI time.
on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'

env:
  IDF_VERSION: v5.5.4
  WORKING_DIR: firmware

jobs:
  # ---------- STAGE 1: Lint & Static Analysis ----------
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format & cppcheck
        run: sudo apt-get update && sudo apt-get install -y clang-format cppcheck

      - name: Check code formatting
        run: |
          find main include -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror

      - name: Run cppcheck (static analysis)
        run: |
          cppcheck --version
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --inline-suppr \
            -I include main

      - name: MISRA-C check (informational only)
        continue-on-error: true
        run: |
          cppcheck --addon=misra --enable=all -I include main 2> misra-report.txt || true

      - name: Upload MISRA report
        uses: actions/upload-artifact@v4
        with:
          name: misra-report
          path: firmware/misra-report.txt

  # ---------- STAGE 2: Secrets & Dependency Scanning ----------
  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to scan commits

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

      - name: Dependency / component CVE scan
        run: |
          pip install --break-system-packages grype-wrapper || true
          # or: sudo curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh
          grype dir:. --fail-on medium || true

      - name: Upload security scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: firmware/security-scan-report.txt

  # ---------- STAGE 3a: Debug Build (for testing/diagnostics) ----------
  build-debug:
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      matrix:
        target: [esp32]
    steps:
      - uses: actions/checkout@v4

      - name: Build Debug firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: firmware
          command: |
            idf.py set-target ${{ matrix.target }}
            idf.py -DCMAKE_BUILD_TYPE=Debug build

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-debug
          path: |
            firmware/build/*.bin
            firmware/build/*.elf

  # ---------- STAGE 3b: Release Build (what actually ships) ----------
  build-release:
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    strategy:
      matrix:
        target: [esp32]
    steps:
      - uses: actions/checkout@v4

      - name: Build Release firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: firmware
          command: |
            idf.py set-target ${{ matrix.target }}
            idf.py -DCMAKE_BUILD_TYPE=Release build

      - name: Check binary size (release only — this is what ships)
        run: |
          idf.py size | tee size-report.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}-release
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/size-report.txt

  # ---------- STAGE 4: Firmware / Binary Security Checks (release only) ----------
  firmware-security-checks:
    needs: build-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Download release firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32-release
          path: firmware/build/

      # - name: Verify secure boot / flash encryption config
      #   run: |
      #     python tools/check_secure_boot_config.py build/*.bin

      - name: Confirm release binary is stripped of debug symbols
        run: |
          arm-none-eabi-objdump -h build/*.elf | grep -q '.debug' && \
            (echo "Debug sections found in release build!" && exit 1) || echo "Clean"

      - name: Scan binary for hardcoded secrets
        run: |
          gitleaks detect --source build/ --no-git || true

  # ---------- STAGE 5: Unit Tests (host-based) ----------
  unit-tests:
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Install Ceedling / Ruby
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential
          gem install --user-install --no-document ceedling
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> $GITHUB_PATH

      - name: Run unit tests with coverage
        run: |
          cd test
          ceedling gcov:all

      - name: Generate coverage report
        run: |
          cd test
          gcovr --xml-pretty --output coverage.xml
          gcovr --html-details --output coverage.html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            firmware/test/build/artifacts/*.xml
            firmware/test/coverage.xml
            firmware/test/coverage.html

      - name: Publish test summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: firmware/test/build/artifacts/**/*.xml

  # ---------- STAGE 6: Sanitizer Tests (debug-only, host build) ----------
  sanitizer-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Build host tests with ASan/UBSan (-O0)
        run: |
          gcc -O0 -fsanitize=address,undefined -g -I include \
            main/*.c test/host/*.c -o test_host_asan
      - name: Run under sanitizers
        run: ./test_host_asan

