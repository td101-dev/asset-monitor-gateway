  report:
    needs:
      - build-debug
      - unit-tests
      - sanitizer-tests
      # - fuzz-tests
      # - hil-tests
      # - timing-tests
      - build-release
      - firmware-security-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize pipeline results
        run: |
          echo "## Firmware Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Debug Build: ${{ needs.build-debug.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release Build: ${{ needs.build-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Firmware Security Checks: ${{ needs.firmware-security-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sanitizer Tests (debug): ${{ needs.sanitizer-tests.result }}" >> $GITHUB_STEP_SUMMARY
          # Fuzz/HIL/timing lines removed until those jobs are re-enabled above
