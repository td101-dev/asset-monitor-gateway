:project:
  :which_ceedling: gem

  :build_root: build

  :test_file_prefix: test_

  :use_exceptions: FALSE
  :use_test_preprocessor: :none # :tests
  :use_auxiliary_dependencies: TRUE

  :default_tasks:
    - test:all

:paths:

  :test:
    - test

  :source:
    - main
    - main/drivers

  :include:
    - main/include
    - main/drivers

:defines:

  :test:
    # - UNITY_INCLUDE_CONFIG_H
    - ESP_PLATFORM
    - UNIT_TEST

:cmock:

  :mock_prefix: mock_

  :when_no_prototypes: :warn

  :plugins:
    - ignore
    - callback
    - return_thru_ptr

  :treat_as:

    uint8_t: HEX8
    uint16_t: HEX16
    uint32_t: HEX32
    int32_t: INT32

:plugins:

  :enabled:
    - module_generator
    - report_tests_log_factory

:tools:
  # :test_compiler:
  #   :executable: C:/Ruby40-x64/msys64/ucrt64/bin/gcc.exe

  # :test_linker:
  #   :executable: C:/Ruby40-x64/msys64/ucrt64/bin/gcc.exe

  :test_fixture:

    :executable: build/test/out/${1}

:environment:

